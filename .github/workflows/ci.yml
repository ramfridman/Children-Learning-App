name: ci

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets (gitleaks, full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned gitleaks
        run: bash tools/ci/install-tools.sh gitleaks
      - name: Scan the full Git history
        run: gitleaks git --no-banner --redact --verbose --config .gitleaks.toml .
      - name: Scanner self-test (planted fake secrets must be caught)
        run: bash tools/ci/canary-test.sh

  hygiene:
    name: hygiene (forbidden files)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash tools/ci/hygiene.sh

  osv:
    name: osv (dependency vulnerabilities)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned osv-scanner
        run: bash tools/ci/install-tools.sh osv
      - name: Scan every lock file in the repository
        run: osv-scanner scan source --recursive .

  database:
    name: database (Supabase local + pgTAP)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start the local Supabase stack (only the services the tests need)
        run: npx supabase start -x realtime,storage-api,imgproxy,studio,mailpit,logflare,vector,supavisor,edge-runtime,postgres-meta
      - name: Run the pgTAP tests
        run: bash tools/ci/run-with-annotations.sh "pgTAP" npx supabase test db
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.6
      - name: Run the gateway against the real database, as the limited gateway role
        env:
          REQUIRE_DB_TESTS: "1"
          # Local test stack only; these are the stack's throwaway defaults, not secrets.
          TEST_ADMIN_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          TEST_GATEWAY_DB_URL: postgresql://app_gateway:ci-only-gateway-pass@127.0.0.1:54322/postgres
        run: >
          bash tools/ci/run-with-annotations.sh "Deno integration" deno test --frozen
          --allow-read=testvectors,supabase --allow-net=127.0.0.1:54322 --allow-env
          supabase/functions/db_integration_test.ts
      - name: Stop the stack
        if: always()
        run: npx supabase stop --no-backup

  deno:
    name: gateway (Deno fmt, lint, types, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.6
      - name: Format, lint, type-check and test
        run: bash tools/ci/run-with-annotations.sh "Deno" deno task check

  app:
    name: app (Flutter analyze, tests, Android debug build)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true
      - name: Install the locked packages (fails if pubspec.lock is out of date)
        working-directory: app
        run: bash ../tools/ci/run-with-annotations.sh "flutter pub get" flutter pub get --enforce-lockfile
      - name: Format (prints a patch if anything would change)
        run: bash tools/ci/format-or-patch.sh app lib test
      - name: Analyze
        if: ${{ !cancelled() }}
        working-directory: app
        run: bash ../tools/ci/run-with-annotations.sh "flutter analyze" flutter analyze --fatal-infos
      - name: Test
        if: ${{ !cancelled() }}
        working-directory: app
        run: bash ../tools/ci/run-with-annotations.sh "flutter test" flutter test
      - name: Build the dev flavour (debug APK)
        if: ${{ !cancelled() }}
        working-directory: app
        run: bash ../tools/ci/run-with-annotations.sh "flutter build apk" flutter build apk --debug --flavor dev
