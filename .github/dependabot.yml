version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
# Deno (supabase/functions/) has no Dependabot ecosystem; its pinned versions are reviewed by hand.
