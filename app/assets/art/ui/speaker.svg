<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><!-- speaker: "this speaks when touched". Drawn originally on the 24 grid of the ui icons (rounded 2.5 strokes plus a solid fill, one colour). Reference: the common loudspeaker pictogram (a box, a cone opening outward, sound arcs) as in ISO 7000 "loudspeaker" and the usual phone volume glyphs; nothing copied or traced. The waves face the right; the app mirrors it in RTL (design-spec 8: a speaker's waves mirror). --><g transform="translate(0.8 0)"><path d="M3.8 9.2 H7.6 L12.2 5.4 Q13.8 4.2 13.8 6.2 V17.8 Q13.8 19.8 12.2 18.6 L7.6 14.8 H3.8 Q2.6 14.8 2.6 13.6 V10.4 Q2.6 9.2 3.8 9.2 Z" fill="#5BB6E0" stroke="#5BB6E0" stroke-width="1.4" stroke-linejoin="round"></path><path d="M16.6 9.3 Q18.2 12 16.6 14.7" stroke="#5BB6E0" stroke-width="2.5" stroke-linecap="round" fill="none"></path><path d="M19.4 6.6 Q22.6 12 19.4 17.4" stroke="#5BB6E0" stroke-width="2.5" stroke-linecap="round" fill="none"></path></g></svg>
