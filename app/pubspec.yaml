name: nitznutz
description: "Nitznutz learning app (Milestone 1: app shell)."
publish_to: 'none'
version: 0.5.0+5

environment:
  sdk: ^3.13.7

dependencies:
  audioplayers: 6.8.1
  crypto: 3.0.7
  cryptography: 2.9.0
  drift: 2.35.3
  firebase_core: 5.1.0
  firebase_messaging: 17.0.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  flutter_secure_storage: 11.2.0
  flutter_svg: 2.3.0
  hashlib: 2.4.2
  http: 1.6.0
  record: 7.1.2
  sherpa_onnx: 2.0.0
  sqlite3: 3.8.0
  uuid: 4.6.0

dev_dependencies:
  build_runner: 2.17.1
  drift_dev: 2.35.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# The database engine is SQLite3 Multiple Ciphers (encrypted). The build downloads the prebuilt
# library for the pinned `sqlite3` release; see docs/milestones/M1.md, E1.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  uses-material-design: true
  assets:
    - network_hosts.json
    - assets/pack_signing_public_key.txt
    - assets/packs/
    - assets/characters/
    - assets/art/
    - assets/art/scenes/
    - assets/art/ui/
    - assets/art/stickers/
    - assets/art/world/
    - assets/art/trophies/
    - assets/art/medals/
    - assets/art/decorations/
    - assets/art/ceremony/
    - assets/art/prizes/
    - assets/world/objects.json
  fonts:
    # Heebo is a variable font (weight axis 100 to 900); each family entry maps a real weight to it.
    - family: Heebo
      fonts:
        - asset: assets/fonts/Heebo-Variable.ttf
    - family: SecularOne
      fonts:
        - asset: assets/fonts/SecularOne-Regular.ttf
