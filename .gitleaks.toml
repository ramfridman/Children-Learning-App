title = "Nitznutz gitleaks rules"

[extend]
# Start from gitleaks' built-in rules, then add rules for the vendors this project uses.
useDefault = true

[[rules]]
id = "nitznutz-anthropic-api-key"
description = "Anthropic API key"
regex = '''sk-ant-[A-Za-z0-9_\-]{20,}'''
keywords = ["sk-ant-"]

[[rules]]
id = "nitznutz-elevenlabs-api-key"
description = "ElevenLabs API key"
regex = '''\bsk_[a-f0-9]{40,64}\b'''
keywords = ["sk_"]

[[rules]]
id = "nitznutz-supabase-secret-key"
description = "Supabase secret API key"
regex = '''sb_secret_[A-Za-z0-9_\-]{20,}'''
keywords = ["sb_secret_"]

[[rules]]
id = "nitznutz-database-url-with-password"
description = "Postgres connection string with an embedded password"
regex = '''postgres(?:ql)?://[^:\s/@]+:[^@\s]{6,}@[^\s'"]+'''
keywords = ["postgres"]
  [[rules.allowlists]]
  description = "The well-known local Supabase stack defaults are not secrets"
  regexes = ['''@(127\.0\.0\.1|localhost|host\.docker\.internal)[:/]''']

[[rules]]
id = "nitznutz-firebase-service-account"
description = "Google service account key file"
regex = '''"private_key_id"\s*:\s*"[a-f0-9]{40}"'''
keywords = ["private_key_id"]

[[allowlists]]
description = "SHA-256 of the public ivrit.ai tokens.txt (model_spec.dart); a hash, not a key"
regexTarget = "match"
regexes = ['''e4ebb5e72a6aeef47437a55fa2308ebbedb7c51c557de7a89bf965c23ea9af4a''']

[[allowlists]]
description = "SHA-256 of the public tokens.txt of the English and Russian speech models (tools/make-asr-models.ps1, model_spec.dart); hashes, not keys"
regexTarget = "match"
regexes = [
  '''49e3c2646595fd907228b3c6787069658f67b17377c60aeb8619c4551b2316fb''',
  '''93bbbc0bae6b78c0bbb743d4aa9fded3bb5ff3aac5f0200e3a769a5a05e0fdf6''',
]

[[allowlists]]
description = "Content file names in the Hebrew review tables (tools/hebrew_voice_review.py): 'activity.log.pair.key.json' followed by a row path reads as a generic key; a file name, not a key"
regexTarget = "match"
regexes = ['''activity\.log\.pair\.key\.json''']

[[allowlists]]
description = "The owner's approval snapshots (tools/owner_approval.py): each row is source,id,sha256 of the row's text; a string id such as 'alertAddSecret' next to a text hash reads as a generic key; hashes of Hebrew text, not keys"
paths = ['''^docs/review/owner-approval-\d{4}-\d{2}-\d{2}\.csv$''']
