include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - avoid_print
    - prefer_final_locals
    - unawaited_futures
    - always_declare_return_types
    - prefer_single_quotes

# Same line width as the Deno side of the repo.
formatter:
  page_width: 110
